name: Monthly builds

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    tags:
      - '*'
    branches:
      - main
    paths-ignore:
      - .github/worflows/promote-snaps.yaml
      - .github/worflows/keep_alive.yaml
      - README.md
      - .gitignore
  pull_request:
    branches:
      - main
    paths-ignore:
      - .github/worflows/promote-snaps.yaml
      - .github/worflows/keep_alive.yaml
      - README.md
      - .gitignore
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-snapcrafts:
    name: Generate snapcraft.yaml files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Generate snapcraft yaml files for all ROS distros
        id: generate
        run: |
          pip install .
          python3 ./generate_all_ros_meta_snapcraft_file.py

          # List all snap folders (architecture-free names)
          matrix=$(ls snaps/ | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

      - name: Upload snapcrafts folders
        uses: actions/upload-artifact@v7
        with:
          name: snapcraft_yamls
          path: snaps/

  snap-build:
    name: Build snaps
    needs: generate-snapcrafts
    strategy:
      fail-fast: false
      matrix:
        snap_name: ${{ fromJSON(needs.generate-snapcrafts.outputs.matrix) }}
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
        # Foxy snaps use base: core20, so snapcraft builds them in a focal
        # LXD container. The ubuntu-24.04 runner image moved to a Linux 7.0
        # kernel, which rejects the AppArmor profiles emitted by focal's
        # apparmor_parser 2.13 ("Profile doesn't conform to protocol"),
        # preventing snapd from starting in the build container.
        # Pin foxy builds to ubuntu-22.04 runners (6.x kernel) until the
        # kernel/AppArmor incompatibility is fixed upstream.
        # https://github.com/canonical/craft-actions/issues/144
        # https://github.com/actions/runner-images/issues/15197
        # https://bugs.launchpad.net/bugs/2172229
        exclude:
          - snap_name: foxy-desktop
            runs-on: ubuntu-latest
          - snap_name: foxy-desktop
            runs-on: ubuntu-24.04-arm
          - snap_name: foxy-desktop-dev
            runs-on: ubuntu-latest
          - snap_name: foxy-desktop-dev
            runs-on: ubuntu-24.04-arm
          - snap_name: foxy-ros-base
            runs-on: ubuntu-latest
          - snap_name: foxy-ros-base
            runs-on: ubuntu-24.04-arm
          - snap_name: foxy-ros-base-dev
            runs-on: ubuntu-latest
          - snap_name: foxy-ros-base-dev
            runs-on: ubuntu-24.04-arm
          - snap_name: foxy-ros-core
            runs-on: ubuntu-latest
          - snap_name: foxy-ros-core
            runs-on: ubuntu-24.04-arm
          - snap_name: foxy-ros-core-dev
            runs-on: ubuntu-latest
          - snap_name: foxy-ros-core-dev
            runs-on: ubuntu-24.04-arm
        include:
          - snap_name: foxy-desktop
            runs-on: ubuntu-22.04
          - snap_name: foxy-desktop
            runs-on: ubuntu-22.04-arm
          - snap_name: foxy-desktop-dev
            runs-on: ubuntu-22.04
          - snap_name: foxy-desktop-dev
            runs-on: ubuntu-22.04-arm
          - snap_name: foxy-ros-base
            runs-on: ubuntu-22.04
          - snap_name: foxy-ros-base
            runs-on: ubuntu-22.04-arm
          - snap_name: foxy-ros-base-dev
            runs-on: ubuntu-22.04
          - snap_name: foxy-ros-base-dev
            runs-on: ubuntu-22.04-arm
          - snap_name: foxy-ros-core
            runs-on: ubuntu-22.04
          - snap_name: foxy-ros-core
            runs-on: ubuntu-22.04-arm
          - snap_name: foxy-ros-core-dev
            runs-on: ubuntu-22.04
          - snap_name: foxy-ros-core-dev
            runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Download snapcrafts folders
        uses: actions/download-artifact@v8
        with:
          name: snapcraft_yamls
          path: snaps/

      - name: Print snapcraft.yaml
        run: cat snaps/${{ matrix.snap_name }}/snapcraft.yaml

      - name: Determine snapcraft channel
        id: snapcraft
        run: |
          if [[ "${{ matrix.snap_name }}" == *foxy* ]]; then
            echo "channel=8.x/stable" >> $GITHUB_OUTPUT
          else
            echo "channel=latest/stable" >> $GITHUB_OUTPUT
          fi

      - name: Build snap
        uses: canonical/action-build@v1
        id: build-snap
        with:
          path: snaps/${{ matrix.snap_name }}
          snapcraft-channel: ${{ steps.snapcraft.outputs.channel }}
      - name: Get architecture
        id: get-arch
        run: echo "arch=$(dpkg --print-architecture)" >> $GITHUB_OUTPUT

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.snap_name }}-${{ steps.get-arch.outputs.arch }}
          path: ${{ steps.build-snap.outputs.snap }}

  ros-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [generate-snapcrafts, snap-build]
    strategy:
      fail-fast: false
      matrix:
        snap_name: ${{ fromJSON(needs.generate-snapcrafts.outputs.matrix) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.snap_name }}-${{ matrix.arch }}
          path: .

      - name: Get snap filename
        run: echo "SNAPFILE=$(ls *.snap)" >> $GITHUB_ENV

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ env.SNAPFILE }}
          release: beta
